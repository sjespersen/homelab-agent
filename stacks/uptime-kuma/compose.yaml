# Uptime Kuma: status page and alerts. Served by Caddy at status.<DOMAIN>.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329  # built 2026-10-09
    container_name: uptime-kuma
    network_mode: host
    # Run as your user so the nightly backup can read ./data.
    user: "${PUID}:${PGID}"
    environment:
      UPTIME_KUMA_HOST: 127.0.0.1
      UPTIME_KUMA_PORT: "3001"
      TZ: ${TZ}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
