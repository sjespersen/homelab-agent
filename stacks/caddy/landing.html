<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{env "NAME"}}</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524; --line: #44403c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 32rem; margin: 3rem auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a { display: block; padding: .85rem 1rem; margin-bottom: .5rem; background: var(--card); border: 1px solid var(--line);
      border-radius: .6rem; color: inherit; text-decoration: none; }
  a:hover { border-color: var(--muted); }
  span { color: var(--muted); font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>{{env "NAME"}}</h1>
<!-- LINKS: install.sh puts the enabled modules' links here. -->
</main>
</body>
</html>
