# Vector: collects the containers' logs (through the read-only Docker proxy) and the API logs of
# the switcher (every model request: source:api) and the Studio, and sends them to VictoriaLogs.
# The search page groups them by `source` and `container_name`; an API entry's `request` and
# `response` hold the whole JSON.
data_dir: /var/lib/vector

sources:
  containers:
    type: docker_logs
    docker_host: http://logs-socket-proxy:2375
    # Vector itself, and the socket proxies (each request they pass on is a line, nothing else)
    exclude_containers: [ai-log-shipper, ai-socket-proxy, ai-logs-socket-proxy, beszel-socket-proxy]
  studio_api:
    type: file
    include: [/studio-logs/api.jsonl*]   # with the rotated files, so lines written just before a rotation still arrive
    read_from: beginning
    max_line_bytes: 16777216
  switcher_api:
    type: file
    include: [/switcher-logs/api.jsonl*]
    read_from: beginning
    max_line_bytes: 16777216

transforms:
  # Without the noise: Ollama's health checks and model list polling, and Open WebUI's INFO
  # lines (its access log). The model requests themselves are in the switcher's API log.
  docker:
    type: remap
    inputs: [containers]
    drop_on_abort: true
    source: |
      msg = string(.message) ?? ""
      if .container_name == "ai-ollama" && match(msg, r'^\[GIN\].*\|\s+(HEAD\s+"/"|GET\s+"/api/(tags|ps|version)")') { abort }
      if .container_name == "ai-webchat" && match(msg, r'\|\s*INFO\s*\|') { abort }
      del(.label)
      .source = "docker"

  studio:
    type: remap
    inputs: [studio_api]
    drop_on_abort: true
    source: |
      e, err = parse_json(.message)
      if err != null || !is_object(e) { abort }
      e = object!(e)
      ts, err = parse_timestamp(e.at, "%Y-%m-%d %H:%M:%S %z")
      if err != null { ts = now() }
      out = {"timestamp": ts, "source": "studio", "container_name": "ai-studio", "kind": e.kind,
             "seconds": e.seconds, "error": e.error, "status": e.status}
      summary = ""
      if e.kind == "llm" {
        out.model = e.request.model
        out.request = encode_json(e.request)
        out.response = encode_json(e.response)
        summary = "LLM " + (to_string(e.request.model) ?? "?") + " · " + (to_string(e.seconds) ?? "?") + " s"
        tokens = e.response.usage   # Ollama's own API: prompt_eval_count and eval_count
        if is_object(tokens) {
          summary = summary + " · " + (to_string(tokens.prompt_tokens) ?? "?") + " → " + (to_string(tokens.completion_tokens) ?? "?") + " tokens"
        } else if e.response.eval_count != null {
          summary = summary + " · " + (to_string(e.response.prompt_eval_count) ?? "?") + " → " + (to_string(e.response.eval_count) ?? "?") + " tokens"
        }
      } else {
        out.request = encode_json(e.graph)
        out.response = encode_json(e.outputs)
        nodes = length(object(e.graph) ?? {})
        summary = "ComfyUI · " + to_string(nodes) + " nodes · " + (to_string(e.seconds) ?? "?") + " s"
      }
      if e.error != null { summary = summary + " · ERROR " + (to_string(e.error) ?? "") }
      out.message = summary
      . = out

  api:
    type: remap
    inputs: [switcher_api]
    drop_on_abort: true
    source: |
      e, err = parse_json(.message)
      if err != null || !is_object(e) { abort }
      e = object!(e)
      ts, err = parse_timestamp(e.at, "%+")
      if err != null { ts = now() }
      . = {"timestamp": ts, "source": "api", "container_name": "ai-switcher", "message": e.summary,
           "path": e.path, "model": e.model, "client": e.client, "agent": e.agent, "status": e.status,
           "seconds": e.seconds, "error": e.error,
           "request": encode_json(e.request), "response": encode_json(e.response)}

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [docker, studio, api]
    endpoints: [http://logs:9428/insert/elasticsearch/]
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: source,container_name
