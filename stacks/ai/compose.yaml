# Local AI: three services that take turns on the GPU (only one runs; each wants all of it):
#   qwen27b  Qwen3.8-27B on llama.cpp            OpenAI-compatible API on 127.0.0.1:8080
#   strata   Qwen3.8-Flash-Next on Strata        same API on the same port
#   swarmui  SwarmUI with ComfyUI, image models  web UI on 127.0.0.1:7801
# The switcher (Caddy: port 8005, with the API under /v1) shows them and switches between them;
# ./ai-model.sh does the same from your computer. The API goes through the switcher: a request
# naming the other chat model switches to it, and an idle chat model stops (AI_IDLE_MINUTES). Compose profiles keep the others from
# starting on a deploy; before-up.sh creates all three so the switcher can start them.
# The API key is in ./data/.env (before-up.sh creates it). Models, ComfyUI and its extensions
# live in AI_MODELS_DIR, not in /opt/stacks, so they stay out of the backups.
# GPU access goes through CDI (nvidia.com/gpu=all), not the NVIDIA runtime hook: with the hook,
# running containers lose the GPU ("Failed to initialize NVML: Unknown Error") whenever systemd
# reloads (apt upgrades, bootstrap.sh). The NVIDIA Container Toolkit keeps the CDI spec current.
services:
  qwen27b:
    profiles: [qwen27b]
    # The CUDA 12.8 build: the cuda13 one needs a newer driver than Ubuntu's recommended one.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:31b39eacce2bab5fde9286ec3980ed5548a3987644e94da0d0c2092f93313538  # b11749
    container_name: ai-qwen27b
    labels:
      homelab.ai.files: llama.cpp   # its models, for the switcher's cache drop
      homelab.ai.title: Qwen3.8-27B
      homelab.ai.about: "Chat, dense 27B on llama.cpp; fast, all on the GPU"
      homelab.ai.kind: chat
      homelab.ai.order: "1"
      homelab.ai.model: qwen3.8-27b   # API requests naming it switch to this service
    user: "${PUID}:${PGID}"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: ./data/.env   # LLAMA_API_KEY; before-up.sh creates it
        required: false
    environment:
      LLAMA_CACHE: /models   # -hf downloads land here
      HOME: /models
    # First start downloads AI_QWEN27B_FILE from AI_QWEN27B_REPO on Hugging Face. Measured on an
    # RTX 5060 Ti 16 GB, all with MTP and an 8-bit KV cache:
    #   unsloth UD-Q3_K_XL (13.1 GB)         32K context, 14.4 GB VRAM, 52 tok/s
    #   ukisai Swift 1.5 GSQ-RCO IQ3_XXS-mtp 100K context, 15.2 GB VRAM, 60 tok/s, and it thinks
    #     (10.4 GB, a fine-tune)             shorter: 67 s to a finished coding answer, 96 s above
    # 128K doesn't fit either. Keep the KV cache at 8 bits: 4-bit makes Qwen 3.8 loop.
    # MTP (the draft head inside the GGUF) nearly doubles the output speed (RTX 5060 Ti:
    # 28 -> 52 tok/s, 91-96% of drafts accepted); it works best with one request at a time.
    # Qwen 3.8 thinks at "xhigh" unless asked otherwise, and clients like Hermes don't ask:
    # on a coding task that was >146 s without an answer, against 96 s for "medium" (~70 s "low").
    command:
      - --hf-repo
      - ${AI_QWEN27B_REPO}
      - --hf-file
      - ${AI_QWEN27B_FILE}
      - --no-mmproj
      - --alias
      - qwen3.8-27b
      - --jinja
      - --ctx-size
      - "${AI_CONTEXT}"
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --parallel
      - "1"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "3"
      - --spec-draft-p-min
      - "0.75"
      # For 100K on 16 GB: MTP keeps its own KV cache for the whole context (16-bit unless told),
      # and a 256-token micro-batch halves the prompt-reading buffer (740 MB at 512).
      - --spec-draft-type-k
      - q8_0
      - --spec-draft-type-v
      - q8_0
      - --ubatch-size
      - "256"
      - --chat-template-kwargs
      - '{"reasoning_effort": "medium"}'   # the default when a request names none
    volumes:
      - ${AI_MODELS_DIR}/llama.cpp:/models
    # The port opens only once the model is downloaded and loaded: without a long start period
    # the image's own check calls a first start unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi   # see the note at the top: survives systemd reloads
              device_ids: [nvidia.com/gpu=all]
              capabilities: [gpu]
    restart: unless-stopped

  strata:
    profiles: [strata]
    # Strata ships no image: the box builds it from the release tag (the first build compiles
    # the engine, ~15-30 min). To update, change the tag in both places and ./deploy.sh.
    build:
      context: https://github.com/Niko1221/Strata.git#v0.1.41   # fb58e0d
      args:
        CUDA_ARCHITECTURES: "120"   # RTX 50 only, for a faster build; RTX 40: 89, RTX 30: 86
        BUILD_VISION: "0"
    image: local/strata:v0.1.41
    container_name: ai-strata
    labels:
      homelab.ai.files: strata   # its models, for the switcher's cache drop
      homelab.ai.title: Qwen3.8-Flash-Next
      homelab.ai.about: "Chat, 125B MoE on Strata; smarter, uses ~50 GB RAM"
      homelab.ai.kind: chat
      homelab.ai.order: "2"
      homelab.ai.model: qwen3.8-flash-next   # also qwen3.8-flash-next-<quant>, Strata's own name
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: ./data/.env   # API_KEY; before-up.sh creates it
        required: false
    environment:
      MODEL: ${AI_STRATA_QUANT}
      # Strata keeps a long context's KV cache in RAM (~1.7 GB at 128K), so it can go far higher
      # than llama.cpp. Setup bakes it into its config: before-up.sh sets REINSTALL=1 for one
      # start when AI_STRATA_CONTEXT differs from it (no download, ~2 min).
      CONTEXT: ${AI_STRATA_CONTEXT}
      # KV streaming: the context's KV cache in RAM, only a 32K window in VRAM, so more experts
      # fit on the GPU (RTX 5060 Ti, IQ3_S, 128K: 45.6 -> 52.2 tok/s at a 19.5K prompt, +1 GB
      # RAM). Setup turns it on only with room to spare by its estimate; "on" overrides that.
      KV_STREAMING: ${AI_STRATA_KV_STREAMING}
      REINSTALL: ${STRATA_REINSTALL:-0}
      VISION: "no"
      GPU: "0"
    # First start downloads the model (~70 GB) and prepares it; later starts take under a minute.
    # Strata keeps 32-62 GB of it in RAM and page-locks part of that for the GPU.
    volumes:
      - ${AI_MODELS_DIR}/strata:/data
    ulimits:
      memlock: -1
    # The engine releases its page-locked RAM on SIGTERM, which takes longer than Docker's 10 s.
    stop_grace_period: 60s
    # Strata's server.py sets its SIGTERM handler only once the model is ready; as PID 1 it ignored
    # SIGTERM while loading (1-3 min), so a stop then waited out the 60 s and was killed. Under an
    # init, Python ends at once while loading and still shuts the engine down cleanly once ready.
    # No TINI_KILL_PROCESS_GROUP: once ready, Python stops the engine itself.
    init: true
    # The image's own check gives a start 10 minutes; a first start downloads ~70 GB.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 60m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi   # see the note at the top: survives systemd reloads
              device_ids: [nvidia.com/gpu=all]
              capabilities: [gpu]
    restart: unless-stopped

  swarmui:
    profiles: [swarmui]
    # No published image either: built on the box from a pinned commit of master (SwarmUI's last
    # release, 0.9.8-Beta from Feb 2026, predates Krea 2). The first start compiles SwarmUI, and
    # its install page sets up ComfyUI (~10 GB, several minutes).
    build:
      context: https://github.com/mcmonkeyprojects/SwarmUI.git#d9ecb52dfd4e147c4f2dc90440331e8dea4036a7   # 2026-10-01
      dockerfile: launchtools/StandardDockerfile.docker
      args:
        UID: "${PUID}"
        # Keep .git in the build: SwarmUI updates itself with git and refuses to install without it.
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"
    image: local/swarmui:d9ecb52
    container_name: ai-swarmui
    labels:
      homelab.ai.files: swarm/Models   # its models, for the switcher's cache drop
      homelab.ai.title: SwarmUI
      homelab.ai.about: "Images: Krea 2, SDXL, Flux and more, on ComfyUI"
      homelab.ai.kind: image
      homelab.ai.order: "3"
      homelab.ai.site: swarm   # the switcher's "Open" button: port 8006 / swarm.<DOMAIN>
    user: "${PUID}:${PGID}"
    cap_drop: [ALL]
    command: ["--forward_restart"]   # exit code 42 (restart from the UI) ends the container; Docker restarts it
    # Its PID 1 is a bash script, which ignores SIGTERM: every stop waited out Docker's timeout and
    # was then killed (60 s per switch to a chat model). An init passes the signal to the whole
    # process group, so SwarmUI and ComfyUI shut down by themselves in seconds.
    init: true
    environment:
      TINI_KILL_PROCESS_GROUP: "1"
    ports:
      - "127.0.0.1:7801:7801"
    volumes:
      # Settings and workflows: in /opt/stacks, so they're backed up. The generated images on the
      # media disk, not backed up.
      - ./data/swarm/Data:/SwarmUI/Data
      - ${AI_MEDIA_DIR}/swarm/Output:/SwarmUI/Output
      - ./data/swarm/CustomWorkflows:/SwarmUI/src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows
      # Models, ComfyUI and extensions: big and downloadable again, on the models disk.
      - ${AI_MODELS_DIR}/swarm/Models:/SwarmUI/Models
      - ${AI_MODELS_DIR}/swarm/dlbackend:/SwarmUI/dlbackend
      - ${AI_MODELS_DIR}/swarm/DLNodes:/SwarmUI/src/BuiltinExtensions/ComfyUIBackend/DLNodes
      - ${AI_MODELS_DIR}/swarm/Extensions:/SwarmUI/src/Extensions
      # ComfyUI's uploads and renders: on the media disk (the Studio mounts them the same way).
      - ${AI_MEDIA_DIR}/comfyui/input:/SwarmUI/dlbackend/ComfyUI/input
      - ${AI_MEDIA_DIR}/comfyui/output:/SwarmUI/dlbackend/ComfyUI/output
    shm_size: "4gb"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7801/"]   # not --spider: HEAD gets 405
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi   # see the note at the top: survives systemd reloads
              device_ids: [nvidia.com/gpu=all]
              capabilities: [gpu]
    restart: unless-stopped

  # Ollama: models you download yourself in the web chat (Open WebUI, below). 8B-14B models run
  # fully on a 16 GB GPU; bigger ones spill into RAM and get slow (a 70B on DDR4: ~1-2 tok/s).
  # Not published: Open WebUI reaches it through the switcher (http://switcher:8079/ollama).
  ollama:
    image: ollama/ollama:latest@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7  # 0.40.6
    container_name: ai-ollama
    labels:
      homelab.ai.title: Ollama
      homelab.ai.about: "Web chat models you download yourself; 8-14B fit the GPU"
      homelab.ai.kind: chat
      homelab.ai.order: "4"
      homelab.ai.site: chat
      # Runs all the time (no profile): it only holds the GPU while a model is loaded. The
      # switcher unloads its models when another service gets the GPU, and Open WebUI's chats
      # reach it through the switcher (/ollama), which gives it the GPU first.
      homelab.ai.always-on: "true"
    user: "${PUID}:${PGID}"
    environment:
      HOME: /models
      OLLAMA_MODELS: /models/models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0          # 8 bits: 4-bit KV caches make models loop
      OLLAMA_CONTEXT_LENGTH: "16384"      # a model's default context; the chat can ask for more
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ${AI_MODELS_DIR}/ollama:/models
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids: [nvidia.com/gpu=all]
              capabilities: [gpu]
    restart: unless-stopped

  # Open WebUI: a ChatGPT-like web chat at port 8007 (chat.<DOMAIN>), always on (CPU only). It
  # chats with Ollama's models (and downloads new ones: Admin Panel -> Settings -> Models), and
  # with the 27B and Strata through their API, whichever has the GPU. Its own accounts: the
  # first one becomes admin; later sign-ups wait for the admin's approval.
  webchat:
    image: ghcr.io/open-webui/open-webui:main@sha256:4860ba005ae8f19f08d1e12b0868855b7b339ea0dad9927f196820fc0de04575  # 0.12.3
    container_name: ai-webchat
    user: "${PUID}:${PGID}"
    ports:
      - "127.0.0.1:3080:8080"
    env_file:
      - path: ./data/webchat.env   # OPENAI_API_KEYS (the AI API key); before-up.sh writes it
        required: false
    environment:
      HOME: /app/backend/data
      # Ollama through the switcher, which gives it the GPU when a chat picks one of its
      # models. Like the URL below, read on the first start only.
      OLLAMA_BASE_URL: http://switcher:8079/ollama
      # The 27B and Strata through the switcher, which starts the one a chat picks. Read on the
      # first start only: Open WebUI keeps its connections in its database after that.
      OPENAI_API_BASE_URLS: "http://switcher:8079/v1"
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key   # sessions survive a recreate
      DEFAULT_USER_ROLE: pending
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - ./data/webchat:/app/backend/data
    restart: unless-stopped

  # The page at port 8005: which service runs, GPU memory, buttons to switch. Login: the API key.
  # Also the chat API (/v1): it starts the model a request names and stops an idle one.
  switcher:
    image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f  # 3.13.16
    container_name: ai-switcher
    labels:
      # A hash of the mounted code (before-up.sh): when it changes, compose recreates the
      # container, so a deploy restarts the switcher with the new code.
      homelab.switcher.code: "${SWITCHER_CODE:-}"
    user: "${PUID}:${PGID}"
    command: ["python", "/app/app.py"]
    env_file:
      - path: ./data/.env   # API_KEY
        required: false
    environment:
      DOCKER_PROXY: ai-socket-proxy:2375
      STATE_FILE: /state/active
      NAME: "${NAME}"   # the box's name, for the page
      LINKS_FILE: /site/links.json   # the other services' links (install.sh), for the page
      IDLE_MINUTES: "${AI_IDLE_MINUTES}"   # stop the chat model after this long unused; 0: never
      POWER: "yes"   # suspend/restart/shut down buttons, for host/homelab-power.sh
      LEDS: "${AI_LEDS}"   # yes: show the LED switch
      LEDS_EFFECT: "${AI_LEDS_ON_MODE}"   # defaults until changed on the page
      LEDS_SPEED: "${AI_LEDS_ON_SPEED}"
    ports:
      - "127.0.0.1:8079:8079"
    volumes:
      - ./switcher:/app:ro
      - ./data/switcher:/state
      # Read-only, to drop a stopped service's model files from the page cache (drop_cache).
      - ${AI_MODELS_DIR}:/models:ro
      # Read-only, for the page's disk fill levels.
      - ${AI_MEDIA_DIR}:/media:ro
      - ../caddy/site:/site:ro
    networks: [default, docker-api]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi   # for nvidia-smi (the memory gauge); the switcher runs no CUDA
              device_ids: [nvidia.com/gpu=all]
              capabilities: [gpu]
    restart: unless-stopped

  # The Studio: brief -> shot list (Qwen) -> stills (Krea 2) -> previews and finals (MiniMax H3)
  # -> upscale (SeedVR2) -> export for Resolve, on SwarmUI's ComfyUI. No GPU of its own: it asks
  # the switcher for it. Projects in data/studio (backed up), renders on the media disk.
  studio:
    image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f  # 3.13.16
    container_name: ai-studio
    labels:
      homelab.studio.code: "${STUDIO_CODE:-}"   # like the switcher's: a deploy restarts it on new code
    user: "${PUID}:${PGID}"
    command: ["python", "/app/app.py"]
    env_file:
      - path: ./data/.env   # API_KEY: the switcher's API and its login cookie
        required: false
    environment:
      COMFY_URL: http://swarmui:7801/ComfyBackendDirect
      SWITCHER: http://switcher:8079
      STUDIO_LLM: "${AI_STUDIO_LLM}"
      TZ: ${TZ}   # the API log's times
    ports:
      - "127.0.0.1:8078:8078"
    volumes:
      - ./studio:/app:ro
      - ./data/studio:/data
      - ${AI_MEDIA_DIR}/studio:/media
      - ${AI_MODELS_DIR}/swarm/Models:/models:ro   # only to see which models are there
      # ComfyUI keeps a copy of every upload (input/) and render (output/studio/): the Studio
      # deletes them once it has its own, and with a deleted project or shot.
      - ${AI_MODELS_DIR}/swarm/dlbackend:/comfy
      - ${AI_MEDIA_DIR}/comfyui/input:/comfy/ComfyUI/input
      - ${AI_MEDIA_DIR}/comfyui/output:/comfy/ComfyUI/output
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped

  # The switcher's only way to Docker: list and inspect containers, start and stop them.
  # Nothing that creates containers, runs commands in them or reads their files.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5  # 3.4.7-r0-ls103
    container_name: ai-socket-proxy
    environment:
      CONTAINERS: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped

  # Logs: VictoriaLogs keeps the containers' logs and the Studio's API log for 30 days (10 GB at
  # most) on the media disk, not backed up, with a search page (port 8009 / logs.<DOMAIN>, behind
  # the switcher's login: site.logs.caddy). Vector collects them (logs/vector.yaml).
  logs:
    image: victoriametrics/victoria-logs:latest@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d  # v1.53.0
    container_name: ai-logs
    user: "${PUID}:${PGID}"
    command:
      - -storageDataPath=/data
      - -retentionPeriod=30d
      - -retention.maxDiskSpaceUsageBytes=10GiB
      - -insert.maxLineSizeBytes=16MiB   # a Studio request carries the whole H3 guide
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - ${AI_MEDIA_DIR}/logs/victoria:/data
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped

  log-shipper:
    image: timberio/vector:latest-alpine@sha256:faee4b4576b4c0f68e65793e6cd4bb93ff3db63a2b3a9489339f366436c72aa4  # 0.60.0
    container_name: ai-log-shipper
    user: "${PUID}:${PGID}"
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./logs/vector.yaml:/etc/vector/vector.yaml:ro
      - ${AI_MEDIA_DIR}/logs/vector:/var/lib/vector   # how far it has read
      - ${AI_MEDIA_DIR}/studio/logs:/studio-logs:ro
    networks: [default, logs-api]
    read_only: true
    cap_drop: [ALL]
    depends_on: [logs]
    restart: unless-stopped

  # Like Beszel's: only reads (container list, inspect, logs, events). Its own internal network,
  # so the switcher's proxy (which can start and stop) stays out of Vector's reach.
  logs-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5  # 3.4.7-r0-ls103
    container_name: ai-logs-socket-proxy
    environment:
      CONTAINERS: "1"
      ALLOW_LOGS: "1"   # since 3.4.7, /containers/<id>/logs needs its own switch
      EVENTS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [logs-api]
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped

networks:
  # No way out and nothing published: only the switcher reaches the proxy.
  docker-api:
    internal: true
  # The same for the logs' proxy: only Vector.
  logs-api:
    internal: true
