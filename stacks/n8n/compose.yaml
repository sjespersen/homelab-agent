# n8n workflow automation. Served by Caddy at n8n.<DOMAIN>.
# Hermes' OpenAI-compatible API is reachable from workflows at http://hermes:8642/v1.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    # Own bridge network, so n8n (which runs workflow code) can't reach the other services'
    # 127.0.0.1 ports. Also joins Hermes' network to call its API; Hermes can reach n8n too.
    networks: [default, hermes]
    ports:
      - "127.0.0.1:5678:5678"   # for Caddy
    environment:
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: "1"
      # Plain HTTP behind Caddy; without this n8n refuses to log in over http.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Nodes that run commands or read files on the server (n8n's default since 2.0; set here
      # so it stays that way).
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      # Includes n8n's encryption key (config); without it, saved credentials are unreadable.
      - ./data:/home/node/.n8n
    restart: unless-stopped

networks:
  hermes:
    name: hermes_default   # created by the hermes stack, which install.sh starts first
    external: true
