# n8n workflow automation. Served by Caddy at n8n.<DOMAIN> (or <server>:8002 without Pi-hole).
# With Hermes enabled, compose.with-hermes.yaml lets workflows call Hermes' API.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest@sha256:3cd1d3a03f5e059a0757d8c95823ff09ef61d3b6bf7fcb4ac3ac5fd5303b6c6d  # 2.41.4
    container_name: n8n
    # Own bridge network, so n8n (which runs workflow code) can't reach the other services'
    # 127.0.0.1 ports.
    networks: [default]
    ports:
      - "127.0.0.1:5678:5678"   # for Caddy
    # Fixed DNS: at boot Docker can start this before the network has handed the server a DNS
    # server, and the container would then resolve nothing until restarted. Quad9, like
    # Pi-hole's upstream (containers can't reach Pi-hole: ufw blocks them from the host).
    dns: [9.9.9.9, 149.112.112.112]
    environment:
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      # Where n8n is reached; install.sh sets them from Caddy's name or port for n8n.
      N8N_HOST: ${SITE_HOST}
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${SITE_URL}
      N8N_PROXY_HOPS: "1"
      # Plain HTTP behind Caddy; without this n8n refuses to log in over http.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Nodes that run commands or read files on the server (n8n's default since 2.0; set here
      # so it stays that way).
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      # Includes n8n's encryption key (config); without it, saved credentials are unreadable.
      - ./data:/home/node/.n8n
    restart: unless-stopped
