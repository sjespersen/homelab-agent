# Hermes Agent gateway (official image). Config, API keys, memories live in ./data.
# First-time setup: docker compose run --rm -it gateway setup
services:
  gateway:
    image: nousresearch/hermes-agent:latest@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db  # built 2026-09-24
    container_name: hermes
    # Own bridge network, not the host's: Hermes can't reach the other services' 127.0.0.1
    # ports. Only the two ports below are published (on all addresses; see README for ufw).
    ports:
      - "8642:8642"
      - "9119:9119"
    # Fixed DNS: at boot Docker can start this before the network has handed the server a DNS
    # server, and the container would then resolve nothing until restarted. Quad9, like
    # Pi-hole's upstream (containers can't reach Pi-hole: ufw blocks them from the host).
    dns: [9.9.9.9, 149.112.112.112]
    environment:
      HERMES_UID: "${PUID}"
      HERMES_GID: "${PGID}"
      # OpenAI-compatible API on the LAN (port 8642). Key: API_SERVER_KEY in ./data/.env
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      # Backend for Hermes Desktop (Settings -> Gateways -> Remote gateway), port 9119.
      # Login: HERMES_DASHBOARD_BASIC_AUTH_* in ./data/.env
      HERMES_DASHBOARD: "1"
    volumes:
      - ./data:/opt/data
    shm_size: "1gb"   # Chromium crashes with Docker's default 64 MB /dev/shm
    command: ["gateway", "run"]
    restart: unless-stopped
