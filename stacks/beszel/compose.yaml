# Beszel: server and container stats with history. Served by Caddy at server.<DOMAIN>.
# The agent reads host stats and the Docker API; the hub stores history and serves the UI.
services:
  beszel:
    image: henrygd/beszel:latest@sha256:897e807a065adf8e89e30ae0cd79d1f5e38fe84ccaffbc418bde9d3cdca4eacc  # 0.20.0
    container_name: beszel
    network_mode: host
    # Run as your user so the nightly backup can read ./data.
    user: "${PUID}:${PGID}"
    command: ["serve", "--http", "127.0.0.1:8090"]
    volumes:
      - ./data:/beszel_data
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:latest@sha256:765e3d4a087c4bcbf6b78ed0f1dfdcd669c4bf6ad5789a832d2944603ae7fd08  # 0.20.0
    container_name: beszel-agent
    network_mode: host
    environment:
      LISTEN: 127.0.0.1:45876
      # Only the hub holding the matching private key may connect. The hub creates the key on
      # first start; until then the agent exits and is restarted.
      KEY_FILE: /hub/id_ed25519.pub
      # Per-container stats through the read-only proxy below, not the Docker socket itself.
      DOCKER_HOST: tcp://127.0.0.1:2375
    volumes:
      - ./data:/hub:ro
    restart: unless-stopped

  # Passes on only the Docker API reads the agent needs (container list, inspect, stats, logs,
  # info); anything that changes state is refused. Mounting the socket directly would give the
  # agent root on the host, even with :ro.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest@sha256:0357c479cc98e863917d1cd8b10e83d35a50ca46a0788f5a192bf792c3b7100d  # 3.4.6-r0-ls100
    container_name: beszel-socket-proxy
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "0"
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
